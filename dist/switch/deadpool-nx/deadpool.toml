banjo_renderer = "renut"
renut_gpu_backend = "deko3d"
banjo_renut_core_layout = false
banjo_renut_resolve_skip = true
banjo_renut_alpha_to_mask_test = false
banjo_renut_render_height_handheld = 720
banjo_renut_render_height_docked = 1080
license_mask = 1
input_xbox_layout = false
input_joycon_sideways = true
deadpool_perf_log = false

# Renderer & Texture safety fixes (prevents black floor / missing textures)
banjo_deko3d_native_16bit = false
banjo_renut_dynamic_texture_rows = false
banjo_renut_keep_unused_targets = false
blur_renut_texture_pool = false
banjo_renut_stream_redeem = false

# Latency & Pacing fixes (prevents frame pacing latency spikes & spinlock stalls)
banjo_async_present = false
spin_hint_yield = false
blur_small_alloc_mb = 0
